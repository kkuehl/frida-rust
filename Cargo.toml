[workspace]
resolver = "2"
members = [
    "frida-gum-sys",
    "frida-gum",
    "frida-sys",
    "frida",
    "examples/core/*",
    "examples/gum/*",
]
# We miss our linux_no_std example from the default members since `cargo check`
# and `cargo test` both attempt to link the `std` library into it in error.
default-members = ["frida-gum-sys", "frida-gum", "frida-sys", "frida"]

[workspace.package]
version = "0.17.2"
authors = [
    "Keegan Saunders <keegan@undefinedbehaviour.org>",
    "Shmarya Rubenstein <github@shmarya.net>",
]
edition = "2024"
license = "wxWindows"
repository = "https://github.com/frida/frida-rust"
description = "Rust bindings for Frida"

[workspace.lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# No panics in production code: return an error, or prove the case cannot happen in the
# types. (clippy.toml lets tests unwrap and index.)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# A library documents its public errors, panics and unsafe.
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
# A return value that must not be ignored, such as [`Owned`] and `Error`.
must_use_candidate = "deny"
